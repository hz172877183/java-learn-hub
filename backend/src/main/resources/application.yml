server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: java-learn-hub
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/learnhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:learnhub}
    password: ${DB_PASSWORD:learnhub123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

learn-hub:
  # 逗号分隔；支持通配 pattern，覆盖手机通过局域网 IP 访问的场景
  cors-origins: http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173,http://172.16.*.*:5173
  # 管理端写接口的 Bearer Token，生产环境请用环境变量覆盖
  admin-token: ${LEARNHUB_ADMIN_TOKEN:dev-admin-token}
  # 普通用户 JWT；密钥至少 32 字节，生产环境务必覆盖
  jwt-secret: ${LEARNHUB_JWT_SECRET:dev-jwt-secret-change-me-at-least-32-bytes}
  jwt-ttl-hours: ${LEARNHUB_JWT_TTL_HOURS:168}
